name: scrape

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn scrape
      - name: commit results
        run: |
          git config user.name "rbt-bot"
          git config user.email "rbt-bot@users.noreply.github.com"
          git add docs/jobs.json
          git diff --cached --quiet || git commit -m "update jobs"
          git pull --rebase -X ours origin main || true
          git push
